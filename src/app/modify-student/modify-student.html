<!-- modify-student.component.html -->
<form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- First Name Field -->
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" formControlName="firstName" />
  </div>

  <!-- Last Name Field -->
  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" formControlName="lastName" />
  </div>

  <!-- Department Field -->
  <div class="form-group">
    <label for="favouriteClass">Favourite Class</label>
    <input type="text" id="favouriteClass" formControlName="favouriteClass" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="isStudent">Is Student</label>
    <input type="checkbox" id="isStudent" formControlName="isStudent" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToStudentList()">Back to List</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
