<!-- modify-student.component.html -->
<form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <mat-form-field class="form-group">
    <mat-label>ID</mat-label>
    <input matInput matTooltip="ID" type="number" id="id" formControlName="id" appAutoFocus/>
  </mat-form-field>

  <!-- First Name Field -->
  <mat-form-field class="form-group">
    <mat-label for="firstName">First Name</mat-label>
    <input matInput matTooltip="Firat Name" type="text" id="firstName" formControlName="firstName" />
  </mat-form-field>

  <!-- Last Name Field -->
  <mat-form-field class="form-group">
    <mat-label for="lastName">Last Name</mat-label>
    <input matInput matTooltip="Last Name" type="text" id="lastName" formControlName="lastName" />
  </mat-form-field>

  <!-- Department Field -->
  <mat-form-field class="form-group">
    <mat-label for="favouriteClass">Favourite Class</mat-label>
    <input matInput matTooltip="Favourite Class" type="text" id="favouriteClass" formControlName="favouriteClass" />
  </mat-form-field>

  <!-- Is Admin Checkbox -->
  <mat-form-field class="form-group">
    <mat-label for="isStudent">Is Student</mat-label>
    <mat-checkbox id="isStudent" formControlName="isStudent" />
  </mat-form-field>

  <!-- Submit Button (Add or Update) -->
  <button matButton="outlined" type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button matButton="elevated" type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button matButton="filled" type="button" (click)="navigateToStudentList()">Back to List</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
